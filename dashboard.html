<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIET Attendance Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    
    .header h1 {
      color: #667eea;
      font-size: 36px;
      margin-bottom: 10px;
    }
    
    .header p {
      color: #666;
      font-size: 16px;
    }
    
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .summary-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.3s ease;
    }
    
    .summary-card:hover {
      transform: translateY(-5px);
    }
    
    .summary-card .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    .summary-card .number {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .summary-card .label {
      color: #666;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .summary-card.safe .number {
      color: #4CAF50;
    }
    
    .summary-card.warning .number {
      color: #f44336;
    }
    
    .summary-card.total .number {
      color: #667eea;
    }
    
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .subject-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      border-left: 6px solid #ddd;
    }
    
    .subject-card:hover {
      transform: translateY(-3px);
    }
    
    .subject-card.safe {
      border-left-color: #4CAF50;
    }
    
    .subject-card.warning {
      border-left-color: #f44336;
    }
    
    .loading {
      background: white;
      border-radius: 16px;
      padding: 60px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .loading .spinner {
      font-size: 64px;
      animation: spin 2s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .loading p {
      color: #666;
      font-size: 14px;
    }
    
    .error {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .error .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .error h2 {
      color: #f44336;
      font-size: 24px;
      margin-bottom: 15px;
    }
    
    .error p {
      color: #666;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .btn:hover {
      background: #5568d3;
    }
    
    .progress-bar {
      background: #e0e0e0;
      border-radius: 10px;
      height: 8px;
      margin-top: 20px;
      overflow: hidden;
    }
    
    .progress-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      transition: width 0.3s ease;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 KIET Attendance Calculator</h1>
      <p>Collecting and analyzing your attendance data...</p>
    </div>
    
    <div id="content">
      <div class="loading">
        <div class="spinner">🔄</div>
        <h2>Collecting Attendance Data</h2>
        <p>Automatically clicking all eye buttons and extracting detailed information...</p>
        <p style="margin-top: 10px; color: #999; font-size: 12px;">This may take 30-40 seconds</p>
        <div class="progress-bar">
          <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
        <p id="progressText" style="margin-top: 10px; color: #667eea; font-weight: 500;">Starting...</p>
      </div>
    </div>
  </div>
  
  <script src="dashboard.js"></script>
</body>
</html>
